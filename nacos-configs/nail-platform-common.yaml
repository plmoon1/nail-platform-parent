# ========================================
# 美甲预约平台 - Nacos 公共配置
# 配置ID: nail-platform-common.yaml
# 分组: NAIL_PLATFORM
# 命名空间: public (或根据环境使用 dev/prod)
# ========================================

# --- 全局配置 ---
spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/nail_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root123}
    # Druid 连接池配置
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 监控统计配置
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
        wall:
          enabled: true
          multi-statement-allow: true

  # Redis 配置
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DB:0}
    password: ${REDIS_PWD:}
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # Cloud 配置
  cloud:
    # Sentinel 限流配置
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASH:127.0.0.1:8858}
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: NAIL_PLATFORM
            data-id: ${spring.application.name}-sentinel-flow.json
            rule-type: flow

# --- MyBatis-Plus 配置 ---
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 分页插件
  pagination:
    enabled: true

# --- Sa-Token 配置（通用部分）---
sa-token:
  token-name: Authorization
  timeout: 2592000        # token有效期 30天
  active-timeout: -1       # token活跃有效期（永久）
  is-concurrent: true      # 允许同一账号多地同时登录
  is-share: true           # 允许跨服务共享会话
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true

# --- 日志配置 ---
logging:
  level:
    root: info
    com.nail.platform: ${LOG_LEVEL:debug}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# --- 阿里云 OSS 配置 ---
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}

# --- Knife4j 接口文档配置 ---
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
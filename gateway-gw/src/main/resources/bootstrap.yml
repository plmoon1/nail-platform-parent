# bootstrap：仅放应用名 + Nacos 连接，便于配置中心最早加载
spring:
  application:
    name: gateway-gw
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: NAIL_PLATFORM
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: NAIL_PLATFORM
        file-extension: yaml
        # 共享配置（会自动加载 nail-platform-common.yaml）
        shared-configs:
          - data-id: nail-platform-common.yaml
            group: NAIL_PLATFORM
            refresh: true